name: CI

on:
  pull_request:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: ./training-and-judge-center-backend/go.mod

      - name: Run tests
        run: go test ./...
        working-directory: ./training-and-judge-center-backend

  migration-test:
    name: Migration Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: ./training-and-judge-center-backend/go.mod

      - name: Run migration tests
        run: go test -tags integration -v ./cmd/migrate/...
        working-directory: ./training-and-judge-center-backend
