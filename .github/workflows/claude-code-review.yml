name: Claude PR Review

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  claude-review:
    if: |
      contains(github.event.comment.body, '/review-claude') &&
      (github.event.issue.pull_request != null || github.event.pull_request != null)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Claude token by commenter
        id: select-token
        env:
          COMMENTER: ${{ github.event.comment.user.login }}
          TOKEN_CARLOSSALAZAR84: ${{ secrets.CLAUDE_TOKEN_CARLOSSALAZAR84 }}
          TOKEN_ALEXAVJ: ${{ secrets.CLAUDE_TOKEN_ALEXAVJ }}
          FALLBACK_TOKEN: ${{ secrets.CLAUDE_TOKEN_CARLOSSALAZAR84 }}
        run: |
          case "$COMMENTER" in
            "CarlosSalazar84") echo "token=$TOKEN_CARLOSSALAZAR84" >> $GITHUB_OUTPUT ;;
            "AlexaVJ")         echo "token=$TOKEN_ALEXAVJ"         >> $GITHUB_OUTPUT ;;
            *)                 echo "token=$FALLBACK_TOKEN"        >> $GITHUB_OUTPUT ;;
          esac

      - name: Run Claude PR Review Toolkit
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ steps.select-token.outputs.token }}
          trigger_phrase: '/review-claude'
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'pr-review-toolkit@claude-code-plugins'
          show_full_output: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}

            /pr-review-toolkit:review-pr all