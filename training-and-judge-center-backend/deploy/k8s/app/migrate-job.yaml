# Job de migración con imagen parametrizable (__IMAGE__), para re-correr migraciones
# en una release. Lo usa el workflow de CD (sustituye __IMAGE__ por la imagen del deploy)
# y el comando manual documentado en GKE_DEPLOY_ROADMAP.md.
# (El bootstrap inicial usa app/jobs.yaml, que trae migrate + seed juntos.)
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  namespace: training-center
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: __IMAGE__
          command: ["/bin/migrate", "up"]
          envFrom:
            - configMapRef:
                name: app-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: JWT_SECRET
            - name: ROTATION_CACHE_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: ROTATION_CACHE_ENCRYPTION_KEY
