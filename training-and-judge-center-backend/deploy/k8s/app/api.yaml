# La imagen del backend es __IMAGE__ (placeholder): se sustituye por la versión al aplicar.
# El CD la actualiza con `kubectl set image` (no aplica este archivo); el bootstrap sustituye __IMAGE__.
# NO hacer `kubectl apply -f api.yaml` directo sin sustituir (dejaría la imagen literal "__IMAGE__").
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: training-center
  annotations:
    cloud.google.com/neg: '{"ingress": true}'
    cloud.google.com/backend-config: '{"default": "api-backend-config"}'
spec:
  selector:
    app: api
  ports:
    - port: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: training-center
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      serviceAccountName: backend
      containers:
        - name: api
          image: __IMAGE__
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: app-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: JWT_SECRET
            - name: ROTATION_CACHE_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: ROTATION_CACHE_ENCRYPTION_KEY
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: SMTP_PASSWORD
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: RABBITMQ_PASSWORD
            - name: RABBITMQ_URL
              value: amqp://judge:$(RABBITMQ_PASSWORD)@rabbitmq:5672/
            # Where uploaded ZIPs are spooled (os.CreateTemp): the capped volume below, not the container layer.
            - name: TMPDIR
              value: /uploads
            # Safety net under the 512Mi limit: the GC works harder before the kernel kills the pod.
            - name: GOMEMLIMIT
              value: 400MiB
          resources:
            requests:
              cpu: 250m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: uploads
              mountPath: /uploads
          readinessProbe:
            httpGet:
              path: /ping
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /ping
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
      volumes:
        # At most maxConcurrentZipUploads (2) ZIPs of up to 150MB are on it at once; the limit is the last line
        # of defence, since going over evicts the pod.
        - name: uploads
          emptyDir:
            sizeLimit: 1Gi
