apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  namespace: training-center
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: us-east1-docker.pkg.dev/training-center-502916/training-center/backend:v0.1.1
          command: ["/bin/migrate", "up"]
          envFrom:
            - configMapRef:
                name: app-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: JWT_SECRET
---
apiVersion: batch/v1
kind: Job
metadata:
  name: seed
  namespace: training-center
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: seed
          image: us-east1-docker.pkg.dev/training-center-502916/training-center/backend:v0.1.1
          command: ["/bin/seed"]
          envFrom:
            - configMapRef:
                name: app-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: DB_PASSWORD
            - name: ADMIN_EMAIL
              value: siluxib@gmail.com
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: ADMIN_PASSWORD
