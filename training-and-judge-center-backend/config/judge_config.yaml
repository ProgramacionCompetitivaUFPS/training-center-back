judge:
  idleTimeoutMinutes: 10

  # Both reserves are carved out of the dind container's budget, where the Docker
  # daemon and the containers it creates live — not out of the worker's.
  dockerDaemonReserveBytes: 536870912  # 512 MiB
  dockerDaemonReserveCores: 1          # subtracted from the concurrency semaphore

  staleRunningAfterMinutes: 10    # RUNNING submissions older than this become SYSTEM_ERROR
  staleValidationAfterMinutes: 20 # same for publish validations; above the client's 9 min HTTP timeout

  # Language properties: true no matter which pool runs the container.
  # In the artifact* fields, {name} is replaced with Checker or Validator.
  languages:
    cpp20:
      image: "judge-runner:cpp20"
      extension: "cpp"
      compileCmd: "g++ -std=c++20 -O2 -o /sandbox/Solution /sandbox/Solution.cpp"
      runCmd: "/sandbox/Solution"
      artifactSource:  "/sandbox/{name}.cpp"
      artifactCompile: "g++ -std=c++20 -O2 -o /sandbox/{name} /sandbox/{name}.cpp"
      artifactPath:    "/sandbox/{name}"
      artifactRun:     "/sandbox/{name}"

    java17:
      image: "judge-runner:java17"
      extension: "java"
      compileCmd: "javac -encoding UTF-8 /sandbox/Solution.java"
      # Without MaxRAMPercentage the JVM caps its heap at 25% of the container.
      runCmd: "java -XX:MaxRAMPercentage=75 -cp /sandbox Solution"
      artifactSource:  "/sandbox/{name}.java"
      # -d keeps the .class files out of /sandbox, so the JAR cannot pick up the source.
      artifactCompile: "javac -encoding UTF-8 -d /sandbox/classes /sandbox/{name}.java && jar --create --file /sandbox/{name}.jar --main-class {name} -C /sandbox/classes ."
      artifactPath:    "/sandbox/{name}.jar"
      artifactRun:     "java -jar /sandbox/{name}.jar"

    python310:
      image: "judge-runner:python310"
      extension: "py"
      compileCmd: ""           # empty = interpreted language, compilation is skipped
      runCmd: "python3 /sandbox/Solution.py"
      artifactSource:  "/sandbox/{name}.py"
      artifactCompile: "python3 -m py_compile /sandbox/{name}.py"
      artifactPath:    "/sandbox/{name}.py"   # the artifact is the source itself
      artifactRun:     "python3 /sandbox/{name}.py"

  # Sizing belongs to the POOL, not to the language: the same language can need
  # different limits depending on what the container is used for.
  # Budgets are carved out of the dind container's memory, minus the daemon reserve.
  pools:
    heavy:  # compiles every language, and runs contestant solutions
      budgetBytes: 6979321856  # 6.5 GiB
      languages:
        cpp20:     { cpu: "1", memoryBytes: 2147483648 }  # 2 GiB
        java17:    { cpu: "1", memoryBytes: 2147483648 }  # 2 GiB (the JVM sees 75%, see runCmd)
        python310: { cpu: "1", memoryBytes: 1073741824 }  # 1 GiB

    light:  # runs already-compiled checkers and validators, never compiles
      budgetBytes: 3221225472  # 3 GiB
      languages:
        cpp20:     { cpu: "1", memoryBytes: 536870912 }   # 512 MiB
        java17:    { cpu: "1", memoryBytes: 1073741824 }  # 1 GiB, for the JVM
        python310: { cpu: "1", memoryBytes: 536870912 }   # 512 MiB
