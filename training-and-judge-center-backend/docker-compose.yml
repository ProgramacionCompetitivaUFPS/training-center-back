services:
  postgres:
    image: postgres:16-alpine
    container_name: training-center-db
    ports:
      - "${POSTGRES_PORT}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 5

  migrate:
    build: .
    container_name: training-center-migrate
    entrypoint: ["/bin/migrate", "up"]
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build: .
    container_name: training-center-api
    ports:
      - "${PORT}:8080"
    environment:
      PORT: "8080"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      MOCK_AUTH: ${MOCK_AUTH:-0}
      VIRTUAL_OBJECT_CONFIG: /config/virtual_object.json
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      STORAGE_LOCAL_DIR: /data/uploads
    volumes:
      - problem_uploads:/data/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
  problem_uploads:
