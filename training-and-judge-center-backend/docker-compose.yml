services:
  postgres:
    image: postgres:16-alpine
    container_name: training-center-db
    ports:
      - "${POSTGRES_PORT}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mailhog:
    image: mailhog/mailhog
    container_name: training-center-mailhog
    ports:
      - "1025:1025" # SMTP server
      - "8025:8025" # Web UI

  redis:
    image: redis:7-alpine
    container_name: training-center-redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
