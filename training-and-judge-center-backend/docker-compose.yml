services:
  postgres:
    image: postgres:16-alpine
    container_name: training-center-db
    ports:
      - "${POSTGRES_PORT}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 5

  migrate:
    build: .
    container_name: training-center-migrate
    entrypoint: ["/bin/migrate", "up"]
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy

  seed:
    build: .
    container_name: training-center-seed
    entrypoint: ["/bin/seed"]
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_NAME: ${ADMIN_NAME:-admin}
      ADMIN_NICKNAME: ${ADMIN_NICKNAME:-admin}
      ADMIN_COUNTRY: ${ADMIN_COUNTRY:-admin}
      ADMIN_CITY: ${ADMIN_CITY:-admin}
      ADMIN_INSTITUTION: ${ADMIN_INSTITUTION:-admin}
    depends_on:
      migrate:
        condition: service_completed_successfully

  nginx:
    image: nginx:alpine
    container_name: training-center-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot_etc:/etc/letsencrypt
      - certbot_var:/var/lib/letsencrypt
      - certbot_webroot:/var/www/html
    depends_on:
      - backend

  certbot:
    image: certbot/certbot
    container_name: training-center-certbot
    volumes:
      - certbot_etc:/etc/letsencrypt
      - certbot_var:/var/lib/letsencrypt
      - certbot_webroot:/var/www/html
    command: certonly --webroot --webroot-path=/var/www/html --email ${CERTBOT_EMAIL} --agree-tos --no-eff-email --non-interactive -d ${DOMAIN}

  backend:
    build: .
    container_name: training-center-api
    expose:
      - "8080"
    environment:
      PORT: "8080"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      SMTP_HOST: ${SMTP_HOST:-mailhog}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@trainingcenter.com}
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://judge:judge@rabbitmq:5672/}
      VIRTUAL_OBJECT_CONFIG: /config/virtual_object.json
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      STORAGE_LOCAL_DIR: /data/uploads
      GCS_BUCKET: ${GCS_BUCKET:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173}
    volumes:
      - problem_uploads:/data/uploads
    depends_on:
      seed:
        condition: service_completed_successfully
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      mailhog:
        condition: service_started

  judge-worker:
    build: .
    container_name: training-center-worker
    entrypoint: ["/bin/worker"]
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://judge:judge@rabbitmq:5672/}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      STORAGE_LOCAL_DIR: /data/uploads
      GCS_BUCKET: ${GCS_BUCKET:-}
      POD_MEMORY_LIMIT: ${POD_MEMORY_LIMIT:-8589934592}
      JUDGE_CONFIG: /config/judge_config.yaml
    volumes:
      - problem_uploads:/data/uploads
      - //./pipe/docker_engine://./pipe/docker_engine
      # Linux / macOS: uncomment the line below, comment out the line above
      # - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      seed:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  mailhog:
    image: mailhog/mailhog
    container_name: training-center-mailhog
    ports:
      - "1025:1025" # SMTP http
      - "8025:8025" # Web UI

  redis:
    image: redis:7-alpine
    container_name: training-center-redis
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management
    container_name: training-center-rabbitmq
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: judge
      RABBITMQ_DEFAULT_PASS: judge
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  problem_uploads:
  rabbitmq_data:
  certbot_etc:
  certbot_var:
  certbot_webroot:
