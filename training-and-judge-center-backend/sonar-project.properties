sonar.projectKey=training-center-backend
sonar.projectName=training-center-backend
sonar.sourceEncoding=UTF-8

sonar.sources=.
sonar.exclusions=**/*.exe,tmp/**,third_party/**,docs/**,deploy/**,deployments/**,docker/**,nginx/**,tests/zipdir/**,**/vendor/**
sonar.tests=.
sonar.test.inclusions=**/*_test.go,internal/testutil/**

sonar.go.coverage.reportPaths=cover.out
sonar.coverage.exclusions=cmd/api/**,cmd/seed/**,cmd/cleanup-sessions/**,cmd/worker/main.go,docs/**,internal/testutil/**,tests/zipdir/**

sonar.scm.disabled=true

sonar.issue.ignore.multicriteria=testLiterals
sonar.issue.ignore.multicriteria.testLiterals.ruleKey=go:S1192
sonar.issue.ignore.multicriteria.testLiterals.resourceKey=**/*_test.go
